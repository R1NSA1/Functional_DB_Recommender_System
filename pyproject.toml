[project]
name = "functional-db-recommender-system"
version = "0.1.0"
description = "Laboratory work 5: functional database recommender system"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "marimo",
    "scikit-learn",
    "sentence-transformers",
    "numpy<2",
    "pandas<3",
    "matplotlib",
    "ipython",
    "scikit-surprise==1.1.4",
    "faiss-cpu",
    "google-genai",
    "google-cloud-aiplatform",
    "pydantic-ai-slim",
]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
